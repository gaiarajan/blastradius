name: Blast Radius Check
description: Runs SPARQL blast radius analysis and comments on PRs

inputs:
  fuseki-password:
    description: Fuseki admin password
    required: true

runs:
  using: composite
  steps:

    - name: Fix Fuseki data permissions
      shell: bash
      run: |
        mkdir -p ./fuseki/data
        chmod -R 777 ./fuseki/data

    - name: Start Fuseki
      shell: bash
      run: |
        docker compose up -d fuseki

    - name: Wait for Fuseki
      shell: bash
      run: |
        for i in {1..30}; do
          if curl -sf http://localhost:3030/\$/ping; then
            exit 0
          fi
          sleep 1
        done

        docker logs blastradius-fuseki
        exit 1

    - name: Create blastradius dataset
      shell: bash
      run: |
        curl -sf -X POST http://localhost:3030/\$/datasets \
          -u admin:${{ inputs.fuseki-password }} \
          --data 'dbName=blastradius&dbType=tdb2' \
          || echo "Dataset already exists"

    - name: Install Python deps
      shell: bash
      run: |
        pip install -r requirements.txt --break-system-packages

    - name: Import project graph
      shell: bash
      run: |
        python cli.py import-all .
      env:
        FUSEKI_ADMIN_PASSWORD: ${{ inputs.fuseki-password }}
        FUSEKI_USER: admin

    - name: Run check-diff
      id: check
      shell: bash
      run: |
        RESULT=$(python cli.py check-diff \
          "${{ github.event.pull_request.base.sha }}" \
          "${{ github.event.pull_request.head.sha }}")

        echo "result<<EOF" >> "$GITHUB_OUTPUT"
        echo "$RESULT" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
      env:
        FUSEKI_ADMIN_PASSWORD: ${{ inputs.fuseki-password }}
        FUSEKI_USER: admin

    - name: Comment blast radius result
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        message: |
          ## Blast radius check

          ```
          ${{ steps.check.outputs.result }}
          ```