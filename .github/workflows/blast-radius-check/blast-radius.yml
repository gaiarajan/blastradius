name: Blast Radius Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  blast-radius:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start Fuseki
        run: docker compose up -d fuseki
        env:
          FUSEKI_ADMIN_PASSWORD: ${{ secrets.FUSEKI_ADMIN_PASSWORD }}

      - name: Wait for Fuseki
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:3030/\$/ping && break
            sleep 1
          done

      - name: Create blastradius dataset
        run: |
          curl -sf -X POST http://localhost:3030/\$/datasets \
            -u admin:${{ secrets.FUSEKI_ADMIN_PASSWORD }} \
            --data 'dbName=blastradius&dbType=tdb2' \
            || echo "Dataset already exists"

      - name: Install Python deps
        run: pip install -r requirements.txt --break-system-packages

      - name: Import project graph
        run: python cli.py import-all .
        env:
          FUSEKI_ADMIN_PASSWORD: ${{ secrets.FUSEKI_ADMIN_PASSWORD }}

      - name: Run check-diff
        id: check
        run: |
          RESULT=$(python cli.py check-diff \
            "${{ github.event.pull_request.base.sha || github.event.before }}" \
            "${{ github.event.pull_request.head.sha || github.sha }}")

          echo "result<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RESULT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Comment blast radius result
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          message: |
            ## Blast radius check

            ```
            ${{ steps.check.outputs.result }}
            ```