services:
  fuseki:
    image: stain/jena-fuseki:latest
    container_name: blastradius-fuseki
    ports:
      - "3030:3030"
    environment:
      - ADMIN_PASSWORD=${FUSEKI_ADMIN_PASSWORD}
      - JVM_ARGS=-Xmx2g
    volumes:
      - ./fuseki/data:/fuseki
    restart: unless-stopped
  api:
    image: my-api
    depends_on:
      - postgres

  postgres:
    image: postgres:16