services:
  fuseki:
    image: stain/jena-fuseki:latest
    container_name: blastradius-fuseki
    ports:
      - "3030:3030"
    environment:
      - ADMIN_PASSWORD=${FUSEKI_ADMIN_PASSWORD}
      - JVM_ARGS=-Xmx2g
      - FUSEKI_DATASET_1=blastradius
    volumes:
      - ./fuseki/data:/fuseki
    restart: unless-stopped
