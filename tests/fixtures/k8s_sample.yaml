apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth
  ports:
    - port: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
spec:
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: auth:latest
          env:
            - name: DB_URL
              value: "postgres://user-db:5432"

---
apiVersion: v1
kind: Service
metadata:
  name: user-db
spec:
  selector:
    app: userdb
  ports:
    - port: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: userdb-deployment
spec:
  template:
    metadata:
      labels:
        app: userdb
    spec:
      containers:
        - name: userdb
          image: postgres:16

---
apiVersion: v1
kind: Service
metadata:
  name: metrics-service
spec:
  selector:
    app: metrics
  ports:
    - port: 9090
